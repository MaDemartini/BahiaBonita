execution:
  concurrency: 10
  ramp-up: 0s
  hold-for: 10s
  scenario: envio_formulario

scenarios:
  envio_formulario:
    requests:
      - url: http://127.0.0.1:8000/contacto/  # Ajusta esta URL según tu proyecto
        method: POST
        headers:
          Content-Type: application/x-www-form-urlencoded
        body:
          nombre=Prueba Taurus&telefono=123456789&email=prueba@email.com&mensaje=Este es un mensaje de test