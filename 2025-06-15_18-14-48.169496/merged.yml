---
execution:
  concurrency: 10
  hold-for: 10s
  ramp-up: 0s
  scenario: envio_formulario
scenarios:
  envio_formulario:
    requests:
    - body: nombre=Prueba Taurus&telefono=123456789&email=prueba@email.com&mensaje=Este es un mensaje de test
      headers:
        Content-Type: application/x-www-form-urlencoded
      method: POST
      url: http://127.0.0.1:8000/contacto/

