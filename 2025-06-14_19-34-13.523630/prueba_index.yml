execution:
  - concurrency: 100         # 20 usuarios simultáneos
    ramp-up: 10s            # suben gradualmente en 10 segundos
    hold-for: 2m            # duración total: 1 minuto
    scenario: prueba_local

scenarios:
  prueba_local:
    requests:
      - url: http://127.0.0.1:8000/
        method: GET