execution:
  concurrency: 1
  ramp-up: 0s
  hold-for: 10s
  scenario: enviar_contacto_api

scenarios:
  enviar_contacto_api:
    requests:
      - url: http://127.0.0.1:8000/api/contacto/  # 🔁 AJUSTA ESTA URL según tu API real
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "nombre": "Taurus Test",
            "telefono": "999999999",
            "email": "test@bahiabonita.cl",
            "mensaje": "Esto es una prueba automatizada vía API."
          }